# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: carpl

---

# Persistent Volume Claim for Postgres
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: carpl
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---

# Postgres Service
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: carpl
spec:
  type: ClusterIP
  ports:
    - port: 5432
  selector:
    app: postgres

---

# Postgres Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: carpl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:14
          env:
            - name: POSTGRES_USER
              value: prefect
            - name: POSTGRES_PASSWORD
              value: prefectpassword
            - name: POSTGRES_DB
              value: prefectdb
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc

---

# Prefect Server Service (ClusterIP - for port forwarding)
apiVersion: v1
kind: Service
metadata:
  name: prefect-server
  namespace: carpl
spec:
  type: ClusterIP
  selector:
    app: prefect-server
  ports:
    - name: ui
      protocol: TCP
      port: 4200
      targetPort: 4200

---

# Prefect Server Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prefect-server
  namespace: carpl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prefect-server
  template:
    metadata:
      labels:
        app: prefect-server
    spec:
      containers:
        - name: prefect-server
          image: caringdockers/prefect3:v1.0.13
          command: ["prefect", "server", "start", "--host", "0.0.0.0"]
          env:
            - name: PREFECT_API_DATABASE_CONNECTION_URL
              value: "postgresql+asyncpg://prefect:prefectpassword@postgres.carpl.svc.cluster.local:5432/prefectdb"
            - name: PREFECT_UI_API_URL
              value: "http://localhost:4200/api"
          ports:
            - containerPort: 4200

---

# Flow Worker Deployment (connects to local port-forwarded Prefect Server)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flow-worker
  namespace: carpl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flow-worker
  template:
    metadata:
      labels:
        app: flow-worker
    spec:
      containers:
        - name: flow-worker
          image: caringdockers/prefect3:v1.0.13
          command: ["/bin/bash", "-c", "./entrypoint.sh"]
          env:
            - name: PREFECT_API_URL
              value: "http://localhost:4200/api"

