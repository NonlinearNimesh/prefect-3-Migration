---
apiVersion: v1
kind: Service
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yaml --stdout
    kompose.version: 1.35.0 (9532ceef3)
  labels:
    io.kompose.service: postgres
  name: postgres
spec:
  ports:
    - name: "5432"
      port: 5432
      targetPort: 5432
  selector:
    io.kompose.service: postgres

---
apiVersion: v1
kind: Service
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yaml --stdout
    kompose.version: 1.35.0 (9532ceef3)
  labels:
    io.kompose.service: prefect-server
  name: prefect-server
spec:
  ports:
    - name: "4200"
      port: 4200
      targetPort: 4200
  selector:
    io.kompose.service: prefect-server

---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yaml --stdout
    kompose.version: 1.35.0 (9532ceef3)
  labels:
    io.kompose.service: flow-deployer
  name: flow-deployer
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: flow-deployer
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yaml --stdout
        kompose.version: 1.35.0 (9532ceef3)
      labels:
        io.kompose.service: flow-deployer
    spec:
      containers:
        - args:
            - /bin/bash
            - -c
            - ./entrypoint.sh
          command:
            - sh
            - -c
            - |2-
                echo 'Waiting for Prefect server to become healthy...';
                until curl -s http://prefect-server:4200/api/health | grep true > /dev/null; do
                  echo 'Prefect server is unavailable - sleeping';
                  sleep 2;
                done;
                echo 'Prefect server is healthy. Generating and deploying flows...';
                sleep 10;
                python generate_prefect_yaml.py && prefect deploy --all;
                echo 'Flow deployment complete.'
          env:
            - name: K8S_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  key: K8S_NAMESPACE
                  name: env
            - name: K8S_SERVICE_ACCOUNT
              valueFrom:
                configMapKeyRef:
                  key: K8S_SERVICE_ACCOUNT
                  name: env
            - name: PREFECT_API_URL
              valueFrom:
                configMapKeyRef:
                  key: PREFECT_API_URL
                  name: env
            - name: WORKER_IMAGE
              valueFrom:
                configMapKeyRef:
                  key: WORKER_IMAGE
                  name: env
            - name: WORK_POOL_INFRA
              valueFrom:
                configMapKeyRef:
                  key: WORK_POOL_INFRA
                  name: env
          image: caringdockers/prefect3:v1.0.13
          name: flow-deployer
      restartPolicy: Always

---
apiVersion: v1
data:
  K8S_NAMESPACE: namespace-prefect
  K8S_SERVICE_ACCOUNT: my-service-account-prefect
  PREFECT_API_URL: http://localhost:4200/api
  WORK_POOL_INFRA: Kubernetes
  WORKER_IMAGE: caringdockers/prefect3:v1.0.7
kind: ConfigMap
metadata:
  labels:
    io.kompose.service: flow-deployer-env
  name: env

---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yaml --stdout
    kompose.version: 1.35.0 (9532ceef3)
  labels:
    io.kompose.service: flow-worker
  name: flow-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: flow-worker
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yaml --stdout
        kompose.version: 1.35.0 (9532ceef3)
      labels:
        io.kompose.service: flow-worker
    spec:
      containers:
        - args:
            - /bin/bash
            - -c
            - ./entrypoint.sh
          env:
            - name: K8S_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  key: K8S_NAMESPACE
                  name: env
            - name: K8S_SERVICE_ACCOUNT
              valueFrom:
                configMapKeyRef:
                  key: K8S_SERVICE_ACCOUNT
                  name: env
            - name: PREFECT_API_URL
              valueFrom:
                configMapKeyRef:
                  key: PREFECT_API_URL
                  name: env
            - name: WORKER_IMAGE
              valueFrom:
                configMapKeyRef:
                  key: WORKER_IMAGE
                  name: env
            - name: WORK_POOL_INFRA
              valueFrom:
                configMapKeyRef:
                  key: WORK_POOL_INFRA
                  name: env
          image: caringdockers/prefect3:v1.0.13
          name: worker
      restartPolicy: Always

---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yaml --stdout
    kompose.version: 1.35.0 (9532ceef3)
  labels:
    io.kompose.service: postgres
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: postgres
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yaml --stdout
        kompose.version: 1.35.0 (9532ceef3)
      labels:
        io.kompose.service: postgres
    spec:
      containers:
        - env:
            - name: POSTGRES_DB
              value: prefectdb
            - name: POSTGRES_PASSWORD
              value: prefectpassword
            - name: POSTGRES_USER
              value: prefect
          image: postgres:14
          name: postgres
          ports:
            - containerPort: 5432
              protocol: TCP
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres-data
      restartPolicy: Always
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    io.kompose.service: postgres-data
  name: postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yaml --stdout
    kompose.version: 1.35.0 (9532ceef3)
  labels:
    io.kompose.service: prefect-server
  name: prefect-server
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: prefect-server
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yaml --stdout
        kompose.version: 1.35.0 (9532ceef3)
      labels:
        io.kompose.service: prefect-server
    spec:
      containers:
        - args:
            - prefect
            - server
            - start
            - --host
            - 0.0.0.0
          env:
            - name: PREFECT_API_DATABASE_CONNECTION_URL
              value: postgresql+asyncpg://prefect:prefectpassword@postgres:5432/prefectdb
          image: caringdockers/prefect3:v1.0.13
          name: prefect-server
          ports:
            - containerPort: 4200
              protocol: TCP
      restartPolicy: Always

