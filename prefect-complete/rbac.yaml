apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: carpl
  name: job-creator-role
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-creator-binding
  namespace: carpl
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: job-creator-role
subjects:
  - kind: ServiceAccount
    name: my-service-account-prefect
    namespace: carpl

