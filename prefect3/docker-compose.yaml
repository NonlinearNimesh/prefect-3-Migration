version: '3.8'

services:
  prefect-server:
    container_name: prefect-server
    image: prefecthq/prefect:3.2.10-python3.10
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: "sqlite+aiosqlite:///./prefect.db"

  flow-worker:
    container_name: worker
    build: .
    environment:
      PREFECT_API_URL: "http://172.31.156.146:4200/api"
    depends_on:
      - prefect-server

  flow-deployer:
    build: .
    container_name: flow-deployer
    depends_on:
      - prefect-server
    entrypoint: >
      sh -c "
        echo 'Waiting for Prefect server to become healthy...';
        until curl -s http://prefect-server:4200/api/health | grep true > /dev/null; do
          echo 'Prefect server is unavailable - sleeping';
          sleep 2;
        done;
        echo 'Prefect server is healthy. Generating and deploying flows...';
        sleep 10;
        python generate_prefect_yaml.py && prefect deploy --all;
        echo 'Flow deployment complete.'"
    environment:
      PREFECT_API_URL: "http://prefect-server:4200/api"

