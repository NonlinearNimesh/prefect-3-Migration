prefect-version: 3.0.0
name: my-prefect-project
dependencies:
  - requirements.txt

flows:
  - entrypoint: src/flows/simple_flow.py
    name: simple-flow
    version: 1.0
    work_pool:
      name: my-docker-pool
      work_queue_name: simple-queue
      job_variables: {}

  - entrypoint: src/flows/image_processing_flow.py
    name: image-processing-flow
    version: 1.0
    work_pool:
      name: my-docker-pool
      work_queue_name: image-queue
      job_variables: {}

  - entrypoint: src/flows/parallel_flow.py
    name: parallel-flow
    version: 1.0
    work_pool:
      name: my-docker-pool
      work_queue_name: tree-queue
      job_variables: {}

deployments:
  - name: simple-deployment
    entrypoint: src/flows/simple_flow.py:simple_flow
    work_pool:
      name: my-docker-pool
      work_queue_name: simple-queue

  - name: image-processing-deployment
    entrypoint: src/flows/image_processing_flow.py:image_processing_flow
    work_pool:
      name: my-docker-pool
      work_queue_name: image-queue

  - name: parallel-deployment
    entrypoint: src/flows/tree_flow.py:tree_flow
    work_pool:
      name: my-docker-pool
      work_queue_name: tree-queue
    schedule:
      interval: 10
      active: true

infrastructure:
  type: process
  env: {}
  labels: []
  name: process-infra
